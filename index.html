<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>점자 쓰기 학습기</title>
<style>
  :root {
    --bg: #111418; --card: #1c2128; --line: #2d3540;
    --text: #f2f4f7; --muted: #9aa4b2; --accent: #ffd23f; --ok: #3ddc97; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    font-size: 18px; line-height: 1.5;
  }
  main { max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 24px; margin: 4px 0 2px; }
  .sub { color: var(--muted); font-size: 15px; margin: 0 0 18px; }

  .btn {
    width: 100%; min-height: 64px; border: 0; border-radius: 14px;
    font-size: 22px; font-weight: 700; cursor: pointer;
    background: var(--accent); color: #111;
  }
  .btn.off { background: var(--line); color: var(--text); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  .status { margin: 12px 0 20px; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .dot-s { width: 12px; height: 12px; border-radius: 50%; background: var(--bad); flex: none; }
  .dot-s.on { background: var(--ok); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
  .card h2 { font-size: 16px; color: var(--muted); margin: 0 0 12px; font-weight: 600; }

  /* 3x2 점자 칸: 왼쪽 1,2,3 / 오른쪽 4,5,6 */
  .cell { display: grid; grid-template-columns: repeat(2, 72px); grid-template-rows: repeat(3, 72px);
          grid-auto-flow: column; gap: 14px; justify-content: center; }
  .bd { border-radius: 50%; border: 3px solid var(--line); display: flex; align-items: center; justify-content: center;
        font-size: 20px; color: var(--muted); transition: background .08s, border-color .08s; }
  .bd.acc { border-color: var(--accent); color: var(--accent); font-weight: 800; }
  .bd.on { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 800; }
  .legend { text-align: center; color: var(--muted); font-size: 14px; margin-top: 12px; }

  .res { font-size: 56px; font-weight: 800; text-align: center; color: var(--accent); min-height: 80px; line-height: 1.4; }
  .ressub { text-align: center; font-size: 17px; min-height: 26px; }
  .cands { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 10px; }
  .cand { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 16px; }
  .cand b { color: var(--accent); }

  .last { font-size: 30px; font-weight: 800; text-align: center; min-height: 45px; }
  .lastsub { text-align: center; color: var(--muted); font-size: 15px; min-height: 22px; }

  .row { display: flex; gap: 10px; align-items: center; margin: 6px 0; font-size: 17px; }
  .row input { width: 22px; height: 22px; }

  #log { font-family: ui-monospace, Consolas, monospace; font-size: 14px; max-height: 260px; overflow-y: auto;
         white-space: pre-wrap; color: #cfd6df; margin: 0; }
  .note { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>점자 쓰기 학습기</h1>
  <p class="sub">STM32 → ESP32 → 블루투스 → 이 화면</p>

  <button id="connect" class="btn" aria-live="polite">연결하기</button>
  <div class="status" role="status" aria-live="polite">
    <span id="sdot" class="dot-s"></span><span id="stext">연결 안 됨</span>
  </div>

  <section class="card" aria-label="현재 누른 점">
    <h2>점자 칸</h2>
    <div class="cell" id="cell">
      <div class="bd" id="d1">1</div><div class="bd" id="d2">2</div><div class="bd" id="d3">3</div>
      <div class="bd" id="d4">4</div><div class="bd" id="d5">5</div><div class="bd" id="d6">6</div>
    </div>
    <div class="legend">노란 원 = 누르는 중 · 노란 테두리 = 모은 점</div>
  </section>

  <section class="card" aria-label="해석 결과">
    <h2>해석 결과 (완료 버튼을 누르면 나와요)</h2>
    <div class="res" id="res" aria-live="assertive">—</div>
    <div class="ressub" id="ressub"></div>
    <div class="cands" id="cands"></div>
  </section>

  <section class="card" aria-label="모은 점">
    <h2>모은 점</h2>
    <div class="last" id="last" aria-live="assertive">—</div>
    <div class="lastsub" id="lastsub"></div>
  </section>

  <section class="card">
    <h2>설정</h2>
    <label class="row"><input type="checkbox" id="speak" checked> 음성으로 읽어 주기</label>
    <label class="row"><input type="checkbox" id="hidePins" checked> 기록에서 PINS·ping 숨기기</label>
    <button id="test" class="btn off" style="min-height:52px;font-size:18px;margin-top:10px">음성 테스트</button>
  </section>

  <section class="card">
    <h2>받은 기록</h2>
    <pre id="log"></pre>
  </section>

  <p class="note">안드로이드 <b>크롬</b>에서 열어 주세요. 삼성 인터넷과 아이폰은 블루투스 웹 연결을 지원하지 않아요.
  nRF Connect 앱이 연결돼 있으면 먼저 끊어 주세요.</p>
</main>

<script>
const SVC = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const TX  = '6e400003-b5a3-f393-e0a9-e50e24dcca9e'; // ESP32 → 폰 (notify)

const $ = id => document.getElementById(id);
let device = null, buf = '', downAt = {};
let collected = new Set();                     // 완료 전까지 모은 점
const decoder = new TextDecoder();             // 한글이 조각나서 와도 이어 붙이기

// 소리로 읽을 때 자음·모음 이름
const JAMO = { 'ㄱ':'기역','ㄴ':'니은','ㄷ':'디귿','ㄹ':'리을','ㅁ':'미음','ㅂ':'비읍','ㅅ':'시옷','ㅇ':'이응',
  'ㅈ':'지읒','ㅊ':'치읓','ㅋ':'키읔','ㅌ':'티읕','ㅍ':'피읖','ㅎ':'히읗','ㅆ':'쌍시옷',
  'ㅏ':'아','ㅑ':'야','ㅓ':'어','ㅕ':'여','ㅗ':'오','ㅛ':'요','ㅜ':'우','ㅠ':'유','ㅡ':'으','ㅣ':'이',
  'ㅐ':'애','ㅒ':'얘','ㅔ':'에','ㅖ':'예','ㅘ':'와','ㅙ':'왜','ㅚ':'외','ㅝ':'워','ㅞ':'웨','ㅟ':'위','ㅢ':'의' };
const spoken = (mode, letter) => `${mode} ${JAMO[letter] || letter}`;

function showCollected() {
  for (let k = 1; k <= 6; k++) $('d' + k).classList.toggle('acc', collected.has(k));
  const list = [...collected].sort();
  $('last').textContent = list.length ? list.join(' · ') : '—';
}

function setStatus(on, text) {
  $('sdot').classList.toggle('on', on);
  $('stext').textContent = text;
  $('connect').textContent = on ? '연결 끊기' : '연결하기';
  $('connect').classList.toggle('off', on);
}

function say(text) {
  if (!$('speak').checked || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR'; u.rate = 1.1;
  speechSynthesis.speak(u);
}

function log(line) {
  const el = $('log');
  const t = new Date().toLocaleTimeString('ko-KR', { hour12: false });
  el.textContent = `${t}  ${line}\n` + el.textContent;
  if (el.textContent.length > 6000) el.textContent = el.textContent.slice(0, 6000);
}

// 빨리 툭 눌러도 눈에 보이도록 최소 300ms는 켜 두기
const litUntil = {};
function setDot(k, on) {
  const el = $('d' + k); if (!el) return;
  if (on) { el.classList.add('on'); litUntil[k] = performance.now() + 300; return; }
  const wait = (litUntil[k] || 0) - performance.now();
  if (wait > 0) setTimeout(() => setDot(k, false), wait);
  else el.classList.remove('on');
}
function showDots(bits) {           // bits: '111110' (0 = 눌림)
  for (let i = 0; i < 6; i++) setDot(i + 1, bits[i] === '0');
}

function handleLine(line) {
  line = line.trim();
  if (!line) return;
  const hide = $('hidePins').checked;

  if (line === 'ping') { if (!hide) log(line); return; }

  let m = line.match(/^PINS\s+([01]{6})$/);
  if (m) { showDots(m[1]); if (!hide) log(line); return; }

  m = line.match(/^K(\d)\s+(DOWN|UP)\s+(\d+)$/);
  if (m) {
    const k = +m[1], down = m[2] === 'DOWN', t = +m[3];
    setDot(k, down);
    if (down) {
      downAt[k] = t;
      collected.add(k); showCollected();
      $('lastsub').textContent = `${k}번 점 누르는 중`;
      say(`${k}번`);
    } else if (downAt[k] !== undefined) {
      const ms = ((t - downAt[k]) >>> 0) / 1000;   // µs → ms (타이머 넘침 대비)
      $('lastsub').textContent = `${k}번 점 · ${ms.toFixed(0)} ms 동안 누름`;
      log(`${k}번 점 · ${ms.toFixed(0)}ms`);         // 한 번 누를 때 한 줄만
      delete downAt[k];
    }
    return;
  }
  // ---- 완료 버튼을 눌렀을 때 STM32가 보내는 해석 결과 ----
  m = line.match(/^CELL\s+([1-6]+)$/);
  if (m) {
    $('ressub').textContent = `입력한 점: ${m[1].split('').join(' · ')}`;
    collected.clear(); showCollected(); $('lastsub').textContent = '';
    return;
  }
  if (line === 'DEC NONE') {
    $('res').textContent = '?'; $('cands').innerHTML = '';
    $('ressub').textContent += ' → 일치하는 점자가 없어요';
    log(`완료 → 일치하는 점자 없음`); say('일치하는 점자가 없어요');
    return;
  }
  if (line.startsWith('DEC ')) {
    const cands = line.slice(4).trim().split(/\s+/).map(x => x.split(':'));   // [['초성','ㄴ'], ...]
    $('res').textContent = cands.map(c => c[1]).filter((v, i, a) => a.indexOf(v) === i).slice(0, 3).join(' / ');
    $('cands').innerHTML = cands.map(([mo, le]) => `<span class="cand">${mo} <b>${le}</b></span>`).join('');
    log(`완료 → ${cands.map(c => c.join(' ')).join(', ')}`);
    const ko = cands.filter(c => c[0] !== '영어');
    say((ko.length ? ko : cands).map(c => spoken(c[0], c[1])).join(', '));
    return;
  }
  m = line.match(/^PAIR\s+(\S+)\s+(\S+):(\S+)$/);
  if (m) {
    $('cands').insertAdjacentHTML('afterbegin', `<span class="cand">두 칸 ${m[1]} → ${m[2]} <b>${m[3]}</b></span>`);
    log(`두 칸 ${m[1]} → ${m[2]} ${m[3]}`);
    setTimeout(() => say(`두 칸으로 읽으면 ${m[3]}`), 1800);
    return;
  }
  if (line === 'EMPTY') {
    $('res').textContent = '—'; $('cands').innerHTML = ''; $('ressub').textContent = '입력된 점이 없어요';
    say('입력된 점이 없어요');
    return;
  }
  log(line);   // 그 밖의 메시지
}

let flushTimer = null;
function onData(e) {
  buf += decoder.decode(e.target.value, { stream: true });   // 20바이트 조각을 이어 붙임
  const parts = buf.split('\n');
  buf = parts.pop();                         // 아직 안 끝난 줄은 남겨 둠
  parts.forEach(handleLine);
  clearTimeout(flushTimer);                  // 줄바꿈 없이 오는 예전 방식 대비
  if (buf) flushTimer = setTimeout(() => { const b = buf; buf = ''; handleLine(b); }, 200);
}

async function connect() {
  if (!navigator.bluetooth) {
    alert('이 브라우저는 블루투스 웹 연결을 지원하지 않아요.\n안드로이드 크롬에서 열어 주세요.');
    return;
  }
  try {
    setStatus(false, '기기 찾는 중…');
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SVC] }, { namePrefix: 'Braille' }],
      optionalServices: [SVC]
    });
    device.addEventListener('gattserverdisconnected', () => {
      setStatus(false, '연결 끊김'); showDots('111111'); say('연결이 끊겼어요');
    });
    setStatus(false, '연결 중…');
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(SVC);
    const tx = await svc.getCharacteristic(TX);
    tx.addEventListener('characteristicvaluechanged', onData);
    await tx.startNotifications();
    setStatus(true, `연결됨: ${device.name || 'BrailleTrainer'}`);
    say('연결됐어요');
  } catch (err) {
    setStatus(false, '연결 실패: ' + err.message);
  }
}

$('connect').addEventListener('click', () => {
  if (device && device.gatt.connected) device.gatt.disconnect();
  else connect();
});
$('test').addEventListener('click', () => say('음성 피드백 테스트입니다'));
</script>
</body>
</html>
